substitutions:
  nombre_dispositivo: "vivero-microgreens"
  umbral_humedad: "30"        # % por debajo del cual se considera "sustrato seco"
  duracion_riego: "10s"       # tiempo que el relé permanece activo por ciclo de riego

esphome:
  name: ${nombre_dispositivo}
  friendly_name: "Vivero Microgreens"

esp32:
  board: esp32dev
  framework:
    type: arduino

# --- Conectividad y control remoto (Home Assistant) ---
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Si el ESP32 pierde el WiFi, levanta un AP propio para poder
  # reconfigurarlo sin desconectar la lógica local de riego.
  ap:
    ssid: "${nombre_dispositivo} Fallback"
    password: !secret wifi_ap_password

captive_portal:

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# --- Sensor de humedad capacitivo (pin analógico) ---
sensor:
  - platform: adc
    pin: GPIO34
    id: humedad_sustrato
    name: "Humedad del Sustrato"
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    accuracy_decimals: 1
    attenuation: 12db
    update_interval: 10s
    filters:
      # Promedia las últimas 15 lecturas (una nueva cada 10s = ventana de 2.5 min)
      # y solo publica el resultado cada 5 muestras: suaviza el ruido típico
      # de los sensores capacitivos sin saturar el bus/API.
      - sliding_window_moving_average:
          window_size: 15
          send_every: 5
      # Convierte el voltaje crudo del ADC a porcentaje de humedad.
      # IMPORTANTE: calibra estos dos puntos con tu sensor real:
      # sumérgelo en agua para el punto "húmedo" y déjalo al aire para el "seco".
      - calibrate_linear:
          - 3.10 -> 0.0    # sustrato/aire seco
          - 1.20 -> 100.0  # sustrato saturado de agua
      - clamp:
          min_value: 0.0
          max_value: 100.0

    # --- Automatización LOCAL: corre dentro del ESP32, no depende de HA ---
    on_value:
      - if:
          condition:
            sensor.in_range:
              id: humedad_sustrato
              below: !lambda "return id(umbral_humedad_numero).state;"
          then:
            - script.execute: regar_planta

# --- Nivel de agua del tanque (interruptor de flotador digital) ---
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO27
      mode:
        input: true
        pullup: true
    id: agua_baja
    name: "Nivel de Agua Bajo"
    device_class: problem
    # Asume flotador normalmente abierto que cierra a GND al bajar el nivel
    # (pin en LOW = tanque bajo). Ajusta "inverted" según tu sensor/cableado.
    inverted: true
    filters:
      # Debounce: ignora rebotes mecánicos del flotador al moverse con el agua.
      - delayed_on: 500ms
      - delayed_off: 500ms

# --- Umbral de humedad editable desde Home Assistant ---
number:
  - platform: template
    name: "Umbral de Riego"
    id: umbral_humedad_numero
    icon: "mdi:water-percent"
    unit_of_measurement: "%"
    min_value: 10
    max_value: 80
    step: 1
    initial_value: ${umbral_humedad}
    optimistic: true
    restore_value: true   # conserva el valor ajustado en HA aunque se reinicie el ESP32

# --- Relé de 5V que alimenta la mini bomba ---
switch:
  - platform: gpio
    pin: GPIO26
    id: rele_bomba
    name: "Bomba de Riego"
    # La mayoría de los módulos de relé de 5V son "active low":
    # se activan con GPIO en LOW. Descomenta si tu módulo lo requiere.
    # inverted: true
    restore_mode: ALWAYS_OFF

# --- Script de riego: evita solapamientos y no riega si falta agua ---
script:
  - id: regar_planta
    mode: single
    then:
      - if:
          condition:
            binary_sensor.is_off: agua_baja
          then:
            - logger.log: "Humedad baja detectada: activando riego de emergencia"
            - switch.turn_on: rele_bomba
            - delay: ${duracion_riego}
            - switch.turn_off: rele_bomba
            - logger.log: "Ciclo de riego finalizado"
          else:
            - logger.log: "Riego cancelado: nivel de agua del tanque bajo"
